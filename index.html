<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess with Windows</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
        }
        button {
            font-size: 18px;
            padding: 15px 30px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
        }
        button:hover {
            background-color: #45a049;
        }
        #kill-chessboard {
            background-color: #f44336;
        }
        #kill-chessboard:hover {
            background-color: #da190b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chess with Windows</h1>
        <p>Create a chessboard using browser popup windows!</p>
        <button id="create-chessboard">Create Chessboard</button>
        <button id="kill-chessboard">Close Chessboard</button>
    </div>
    
    <!-- Preload chess piece images -->
    <div style="display: none;">
        <img src="pieces/WHITE_CHESS_PAWN.svg" alt="white pawn">
        <img src="pieces/WHITE_CHESS_ROOK.svg" alt="white rook">
        <img src="pieces/WHITE_CHESS_KNIGHT.svg" alt="white knight">
        <img src="pieces/WHITE_CHESS_BISHOP.svg" alt="white bishop">
        <img src="pieces/WHITE_CHESS_QUEEN.svg" alt="white queen">
        <img src="pieces/WHITE_CHESS_KING.svg" alt="white king">
        <img src="pieces/BLACK_CHESS_PAWN.svg" alt="black pawn">
        <img src="pieces/BLACK_CHESS_ROOK.svg" alt="black rook">
        <img src="pieces/BLACK_CHESS_KNIGHT.svg" alt="black knight">
        <img src="pieces/BLACK_CHESS_BISHOP.svg" alt="black bishop">
        <img src="pieces/BLACK_CHESS_QUEEN.svg" alt="black queen">
        <img src="pieces/BLACK_CHESS_KING.svg" alt="black king">
    </div>
    
    <script src="script.js"></script>
</body>
</html>
